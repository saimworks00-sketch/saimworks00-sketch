  <text x="500" y="105" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1">MD Saim Mia</text>
  <text x="500" y="145" text-anchor="middle" fill="#9fd3e6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3">IoT &amp; ROBOTICS ENGINEERING STUDENT</text>
  <line x1="420" y1="165" x2="580" y2="165" stroke="#5DB7D6" stroke-opacity="0.7" stroke-width="2"/>
